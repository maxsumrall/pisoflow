name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tooling/package-lock.json
      - run: npm ci
      - run: npm run audit
      - run: npm test
      - run: npm --prefix tooling ci
      - run: npm --prefix tooling run audit
      - run: npx --prefix tooling playwright install --with-deps chromium
      - run: npm --prefix tooling test
      - run: npm --prefix tooling run build-template
      - run: git diff --exit-code -- skills/pisoflow/assets/template.html
